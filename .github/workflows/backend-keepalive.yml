name: Backend keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "Set the BACKEND_HEALTH_URL repository secret to the public /actuator/health URL."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 60 "$BACKEND_HEALTH_URL"
