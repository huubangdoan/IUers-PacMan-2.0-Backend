name: Backend tests

on:
  push:
    paths:
      - "Pacman/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "Pacman/**"
      - ".github/workflows/backend-tests.yml"
  schedule:
    # 02:00 Asia/Saigon (UTC+7)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pacman
          POSTGRES_USER: pacman
          POSTGRES_PASSWORD: pacman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pacman -d pacman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: Pacman/pom.xml
      - name: Run Maven tests
        working-directory: Pacman
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: pacman
          DB_USER: pacman
          DB_PASSWORD: pacman
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: bash ./mvnw --batch-mode --no-transfer-progress test

  report-failure:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "[CI] Daily backend tests failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled backend test run failed. Review the logs and fix the cause:\n\n${runUrl}\n\nThis issue is updated by the next scheduled run.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
            }
